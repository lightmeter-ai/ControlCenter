# GitLab is a read-only compatibility and archive surface.
#
# The authoritative repository and all automation live at:
# https://github.com/lightmeter-ai/ControlCenter
#
# Keep this fail-closed workflow declaration while the GitLab project remains
# available for historical links and the legacy Go module path. It guarantees
# that pushes or schedules cannot create a second CI/CD writer.
workflow:
  rules:
    - when: never
