name: Nightly image

# The two GitLab schedules were disabled before migration. Keep the capability
# manual here so migration cannot unexpectedly reactivate a dormant publisher.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to build
        required: true
        default: master
        type: string
      image_tag:
        description: Docker tag, normally nightly-master or nightly-develop
        required: true
        default: nightly-master
        type: choice
        options:
          - nightly-master
          - nightly-develop

permissions:
  contents: read

concurrency:
  group: nightly-${{ inputs.image_tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ inputs.image_tag }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out selected ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish Docker Hub and GHCR images
        run: sh ci/publish_docker_image.sh "${{ inputs.image_tag }}" nightly "${{ inputs.ref }}"
