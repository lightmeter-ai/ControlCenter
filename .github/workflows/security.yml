name: Security

on:
  pull_request:
  push:
    branches:
      - master
      - develop
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language:
          - go
          - javascript-typescript
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Initialize CodeQL
        uses: github/codeql-action/init@f1f6e5f6af878fb37288ce1c627459e94dbf7d01 # v3.30.1
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@f1f6e5f6af878fb37288ce1c627459e94dbf7d01 # v3.30.1
      - name: Analyze
        uses: github/codeql-action/analyze@f1f6e5f6af878fb37288ce1c627459e94dbf7d01 # v3.30.1

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Review dependency changes
        uses: actions/dependency-review-action@595b5aeba73380359d98a5e087f648dbb0edce1b # v4.7.3

  vulnerability-scan:
    name: Go vulnerability scan
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: 1.21.10
          cache: true
      - name: Install pinned govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.0.4
      - name: Run govulncheck
        continue-on-error: true
        run: |
          set +e
          set -o pipefail
          "$(go env GOPATH)/bin/govulncheck" ./... 2>&1 | tee govulncheck.txt
          govuln_status=${PIPESTATUS[0]}
          set -e
          if [ "$govuln_status" -ne 0 ]; then
            echo "::warning::govulncheck exited with status ${govuln_status}; see govulncheck-report"
            exit "$govuln_status"
          fi
      - name: Upload vulnerability evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: govulncheck-report
          path: govulncheck.txt
          if-no-files-found: warn

  npm-audit:
    name: npm dependency audit
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 16
          cache: npm
          cache-dependency-path: frontend/controlcenter/package-lock.json
      - name: Audit frontend dependencies
        working-directory: frontend/controlcenter
        run: |
          audit_status=0
          npm audit --audit-level=high --json > npm-audit.json || audit_status=$?
          if ! audit_counts="$(node -e '
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const counts = report && report.metadata && report.metadata.vulnerabilities;
            if (!counts || !Number.isInteger(counts.total) ||
                !Number.isInteger(counts.high) || !Number.isInteger(counts.critical)) {
              process.exit(1);
            }
            process.stdout.write(String(counts.total) + " " + String(counts.high + counts.critical));
          ' npm-audit.json)"; then
            echo "::error::npm audit did not produce a valid vulnerability report"
            exit 2
          fi
          read -r vulnerability_total high_or_critical <<EOF
          $audit_counts
          EOF
          if [ "$audit_status" -ne 0 ] && [ "$high_or_critical" -eq 0 ]; then
            echo "::error::npm audit failed with status ${audit_status} without reporting high or critical vulnerabilities"
            exit "$audit_status"
          elif [ "$audit_status" -ne 0 ]; then
            echo "::warning::npm audit reported ${high_or_critical} high or critical legacy dependency findings; see npm-audit-report"
          fi
          printf 'npm audit status=%s vulnerabilities=%s report_bytes=%s\n' \
            "$audit_status" "$vulnerability_total" "$(wc -c < npm-audit.json)"
      - name: Upload npm audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-audit-report
          path: frontend/controlcenter/npm-audit.json
          if-no-files-found: warn

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Validate SonarCloud credential
        id: sonar-auth
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::warning::SONAR_TOKEN is not configured; replace the expired legacy credential to re-enable SonarCloud"
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          validation_file="${RUNNER_TEMP}/sonar-authentication.json"
          if ! curl --fail --silent --show-error \
            --connect-timeout 10 \
            --retry 2 \
            --user "${SONAR_TOKEN}:" \
            "${SONAR_HOST_URL%/}/api/authentication/validate" \
            --output "$validation_file"; then
            echo "::error::SonarCloud credential validation could not be executed"
            exit 1
          fi

          if jq --exit-status '.valid == true' "$validation_file" >/dev/null; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The migrated SONAR_TOKEN is expired; replace it to re-enable SonarCloud"
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Go
        if: steps.sonar-auth.outputs.enabled == 'true'
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: 1.21.10
          cache: true
      - name: Install generation dependencies
        if: steps.sonar-auth.outputs.enabled == 'true'
        run: sudo apt-get update && sudo apt-get install --yes ragel
      - name: Generate coverage for SonarCloud
        if: steps.sonar-auth.outputs.enabled == 'true'
        run: ./tools/go_test.sh -coverprofile=coverinfo.txt
      - name: Install pinned golangci-lint
        if: steps.sonar-auth.outputs.enabled == 'true'
        run: |
          lint_archive=golangci-lint-1.59.1-linux-amd64.tar.gz
          curl --fail --location --silent --show-error \
            "https://github.com/golangci/golangci-lint/releases/download/v1.59.1/${lint_archive}" \
            --output "${RUNNER_TEMP}/${lint_archive}"
          printf '%s  %s\n' \
            'c30696f1292cff8778a495400745f0f9c0406a3f38d8bb12cef48d599f6c7791' \
            "${RUNNER_TEMP}/${lint_archive}" | sha256sum --check
          tar --extract --gzip \
            --file "${RUNNER_TEMP}/${lint_archive}" \
            --directory "${RUNNER_TEMP}"
      - name: Generate SonarCloud lint report
        if: steps.sonar-auth.outputs.enabled == 'true'
        run: |
          lint_status=0
          "${RUNNER_TEMP}/golangci-lint-1.59.1-linux-amd64/golangci-lint" run \
            --timeout 10m \
            --out-format checkstyle \
            > golangci-output-checkstyle.xml || lint_status=$?

          if [ "$lint_status" -ne 0 ] && [ ! -s golangci-output-checkstyle.xml ]; then
            exit "$lint_status"
          fi

          printf 'golangci-lint status=%s report_bytes=%s\n' \
            "$lint_status" "$(wc -c < golangci-output-checkstyle.xml)"
      - name: Scan with SonarCloud
        if: steps.sonar-auth.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        with:
          args: -Dsonar.host.url=${{ env.SONAR_HOST_URL }}

  license-compliance:
    name: REUSE license compliance
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run REUSE lint
        run: pipx run 'reuse==5.1.1' lint
