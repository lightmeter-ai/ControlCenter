name: Security

on:
  pull_request:
  push:
    branches:
      - master
      - develop
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language:
          - go
          - javascript-typescript
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Initialize CodeQL
        uses: github/codeql-action/init@f1f6e5f6af878fb37288ce1c627459e94dbf7d01 # v3.30.1
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@f1f6e5f6af878fb37288ce1c627459e94dbf7d01 # v3.30.1
      - name: Analyze
        uses: github/codeql-action/analyze@f1f6e5f6af878fb37288ce1c627459e94dbf7d01 # v3.30.1

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Review dependency changes
        uses: actions/dependency-review-action@595b5aeba73380359d98a5e087f648dbb0edce1b # v4.7.3

  vulnerability-scan:
    name: Go vulnerability scan
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run govulncheck
        uses: golang/govulncheck-action@b625fbe08f3bccbe446d94fbf87fcc875a4f50ee # v1.0.4
        with:
          go-version-input: 1.21.10
          go-package: ./...

  npm-audit:
    name: npm dependency audit
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 16
          cache: npm
          cache-dependency-path: frontend/controlcenter/package-lock.json
      - name: Audit frontend dependencies
        working-directory: frontend/controlcenter
        run: npm audit --audit-level=high

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    continue-on-error: true
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: 1.21.10
          cache: true
      - name: Install generation dependencies
        run: sudo apt-get update && sudo apt-get install --yes ragel
      - name: Generate coverage for SonarCloud
        run: ./tools/go_test.sh -coverprofile=coverinfo.txt
      - name: Install pinned golangci-lint
        run: |
          lint_archive=golangci-lint-1.59.1-linux-amd64.tar.gz
          curl --fail --location --silent --show-error \
            "https://github.com/golangci/golangci-lint/releases/download/v1.59.1/${lint_archive}" \
            --output "${RUNNER_TEMP}/${lint_archive}"
          printf '%s  %s\n' \
            'c30696f1292cff8778a495400745f0f9c0406a3f38d8bb12cef48d599f6c7791' \
            "${RUNNER_TEMP}/${lint_archive}" | sha256sum --check
          tar --extract --gzip \
            --file "${RUNNER_TEMP}/${lint_archive}" \
            --directory "${RUNNER_TEMP}"
      - name: Generate SonarCloud lint report
        run: |
          lint_status=0
          "${RUNNER_TEMP}/golangci-lint-1.59.1-linux-amd64/golangci-lint" run \
            --out-format checkstyle \
            > golangci-output-checkstyle.xml || lint_status=$?

          if [ "$lint_status" -ne 0 ] && [ ! -s golangci-output-checkstyle.xml ]; then
            exit "$lint_status"
          fi

          printf 'golangci-lint status=%s report_bytes=%s\n' \
            "$lint_status" "$(wc -c < golangci-output-checkstyle.xml)"
      - name: Scan with SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        with:
          args: -Dsonar.host.url=${{ env.SONAR_HOST_URL }}

  license-compliance:
    name: REUSE license compliance
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run REUSE lint
        run: pipx run 'reuse==5.1.1' lint
