name: Migrate historical images

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Copy missing tags after digest comparison
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: migrate-historical-controlcenter-images
  cancel-in-progress: false

jobs:
  migrate:
    name: Verify and migrate registry tags
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go for crane
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: 1.23.12
          cache: false
      - name: Install pinned crane
        run: go install github.com/google/go-containerregistry/cmd/crane@v0.20.8
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Verify or migrate all historical tags
        env:
          APPLY_IMAGE_MIGRATION: ${{ inputs.apply }}
        run: sh ci/migrate_gitlab_images.sh
